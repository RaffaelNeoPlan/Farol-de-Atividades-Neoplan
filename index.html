<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style></head><body>
<title>Farol de Vistoria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma tela — cabeçalho fixo, grade do farol rolável no meio, paleta de status fixa embaixo */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --fg:#141B2B; --muted:#586379; --line:#C7CEDA;
  --head:#1F3864; --head-fg:#FFFFFF; --head-2:#2F5597; --accent:#1F3864; --focus:#F2A93B;
  --red:#E06666; --red-fg:#3A0B0A; --yel:#FFD966; --yel-fg:#3B2C00; --grn:#93C47D; --grn-fg:#0F2E08;
  --na:#D9D9D9; --na-fg:#7A7A7A; --sheet:#FFFFFF; --shadow:0 -6px 18px rgba(20,27,43,.10);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#172033; --fg:#E6EBF4; --muted:#9BA7BC; --line:#2B364B;
  --head:#1A2C52; --head-fg:#FFFFFF; --head-2:#27447E; --accent:#9DB8F2; --sheet:#1B2539; --shadow:0 -6px 18px rgba(0,0,0,.45);
  --na:#3A4252; --na-fg:#9AA3B2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#172033; --fg:#E6EBF4; --muted:#9BA7BC; --line:#2B364B;
  --head:#1A2C52; --head-fg:#FFFFFF; --head-2:#27447E; --accent:#9DB8F2; --sheet:#1B2539; --shadow:0 -6px 18px rgba(0,0,0,.45);
  --na:#3A4252; --na-fg:#9AA3B2; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{height:100%;width:100%;max-width:100vw;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{background:var(--head);color:var(--head-fg);flex:none}
.top .row1{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.brand{flex:1;min-width:0}
.brand .logo{display:block;height:28px;width:auto;color:var(--head-fg);margin-bottom:3px}
.brand .sub{font-family:var(--f-disp);font-weight:600;letter-spacing:.1em;font-size:11px;opacity:.7;text-transform:uppercase;margin-left:8px;vertical-align:2px}
.logofull{display:block;width:180px;height:auto;color:var(--fg);margin:18px auto 4px}
.obra-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.obra-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.obra-btn #obra{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obra-btn .caret{font-size:14px;opacity:.8}
.obra{display:flex;gap:8px;align-items:stretch;min-width:0}
.panel .group{grid-template-columns:minmax(0,1fr)}
.obra-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.obra.cur .obra-main{border-color:var(--head);box-shadow:inset 3px 0 0 var(--head)}
.o-pct{flex:none;width:52px;height:40px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:16px}
.o-pct.sx{background:var(--na);color:var(--na-fg)}
.o-txt{min-width:0}
.o-txt strong{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-txt em{font-style:normal;font-family:var(--f-disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.o-txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.o-del{flex:none;border:1px solid var(--line);background:transparent;border-radius:12px;padding:0 10px;font-size:13px;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.big span{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;opacity:.75}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;height:40px;padding:0 12px;color:var(--head-fg);font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.iconbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--yel)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--head-fg);border-radius:999px;padding:6px 12px;font-family:var(--f-disp);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.chip[aria-pressed="true"]{background:var(--head-fg);color:var(--head)}
.chip .pct{opacity:.8;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--head-2)}
.tab{border:0;background:transparent;color:var(--head-fg);padding:8px 4px 7px;font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.03em;border-bottom:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .p{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-bottom-color:var(--focus);background:rgba(255,255,255,.08)}
.tab.resumo{grid-column:auto}
.banner{background:var(--yel);color:var(--yel-fg);font-size:13px;padding-block:7px;display:flex;gap:10px;align-items:center;flex:none}
.banner b{font-weight:600}
.banner button{margin-left:auto;flex:none;border:1px solid var(--yel-fg);background:transparent;color:var(--yel-fg);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px}

/* grade */
.stage{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.gridbox{flex:1;min-height:0;min-width:0;max-width:100%;overflow:auto;background:var(--surface);overscroll-behavior:contain}
table.farol{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.farol th,.farol td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
.farol thead th{position:sticky;background:var(--head);color:var(--head-fg);z-index:2;font-family:var(--f-disp)}
.farol thead tr.h1 th{top:0;height:32px;font-weight:700;font-size:14px}
.farol thead tr.h2 th{top:32px;height:26px;font-size:12px;font-weight:600}
.farol thead th.pv{min-width:44px;width:44px;cursor:pointer}
.farol thead th.pv:active{filter:brightness(1.3)}
.farol th.name{position:sticky;left:0;z-index:3;text-align:left;padding:0 10px;min-width:150px;max-width:150px;width:150px;background:var(--head)}
.farol thead tr.h2 th.name{background:var(--head-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.farol tbody th.name{background:var(--sheet);color:var(--fg);font-family:var(--f-body);font-weight:500;font-size:12.5px;line-height:1.2;padding:5px 8px;z-index:1;box-shadow:2px 0 0 var(--line)}
.farol tbody th.name .d{display:block;font-family:var(--f-disp);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.05em}
.farol tbody th.name .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.farol tbody th.name .ap{float:right;margin-left:6px;font-family:var(--f-disp);font-weight:700;font-size:13px;padding:1px 5px;border-radius:5px}
.farol td.c{height:40px;min-width:44px;font-family:var(--f-disp);font-weight:700;font-size:15px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:filter .08s}
.farol td.c:active{filter:brightness(.85)}
.s0{background:var(--red);color:var(--red-fg)}
.s1{background:var(--yel);color:var(--yel-fg)}
.s2{background:var(--grn);color:var(--grn-fg)}
.sn{background:var(--na);color:var(--na-fg);cursor:default!important;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.07) 6px 8px)}
.sx{background:transparent}
.farol td.c.flash{animation:fl .35s ease-out}
@keyframes fl{0%{box-shadow:inset 0 0 0 3px var(--focus)}100%{box-shadow:inset 0 0 0 0 var(--focus)}}
@media (prefers-reduced-motion:reduce){.farol td.c.flash{animation:none}}
.thp{font-size:11px}
.thp.s0,.thp.s1,.thp.s2{font-weight:700}

/* resumo */
.resumo{flex:1;min-height:0;overflow:auto;padding-block:16px 24px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;text-align:left;width:100%}
.card header{display:flex;align-items:baseline;gap:10px}
.card h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:20px;flex:1;min-width:0}
.card .g{font-family:var(--f-disp);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.card .meta{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.bar .tr{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar .fi{height:100%;border-radius:5px}
.bar .v{text-align:right;font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums}
.sum-head{display:flex;gap:16px;align-items:end;margin-bottom:14px;flex-wrap:wrap}
.sum-head h2{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:700;text-wrap:balance}
.sum-head p{margin:0;color:var(--muted);font-size:13px}

/* paleta */
.dock{flex:none;background:var(--surface);box-shadow:var(--shadow);border-top:1px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.dock .hint{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;min-height:16px}
.dock .hint b{color:var(--fg);font-weight:600}
.pal{display:grid;gap:5px}
.pb{min-width:0;border:2px solid transparent;border-radius:10px;height:50px;font-family:var(--f-disp);font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-variant-numeric:tabular-nums}
.pb small{font-size:9.5px;font-weight:600;letter-spacing:.03em;margin-top:3px;opacity:.85;max-width:100%;overflow:hidden;white-space:nowrap}
.pb[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset,0 3px 0 var(--fg)}
.pb.tool{background:var(--bg);color:var(--fg);border-color:var(--line);font-size:12.5px;font-weight:600;padding:0 2px}
.pb.tool[aria-pressed="true"]{border-color:var(--fg)}
.pb.tool:disabled{opacity:.4;cursor:default}

/* painéis */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px;font-family:var(--f-disp);font-size:22px;font-weight:700}
.panel p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.45}
.panel .group{display:grid;gap:8px;margin:14px 0}
.panel .group>label.cap{font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.act strong{display:block;font-weight:600;font-size:15px}
.act span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.act .ic{flex:none;width:36px;height:36px;border-radius:9px;background:var(--head);color:var(--head-fg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:13px}
.act.primary{background:var(--head);border-color:var(--head);color:var(--head-fg)}
.act.primary span{color:var(--head-fg);opacity:.8}
.act.primary .ic{background:var(--head-fg);color:var(--head)}
.act:disabled{opacity:.5;cursor:default}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--fg);font:inherit}
.btn{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-weight:600}
.btn.solid{background:var(--head);color:var(--head-fg);border-color:var(--head)}
.btn.danger{background:var(--red);color:var(--red-fg);border-color:var(--red)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.help{font-size:13.5px;line-height:1.5;color:var(--fg)}
.help ol{padding-left:20px;margin:6px 0 0;display:grid;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{padding:32px 0;color:var(--muted);text-align:center}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

const OBRA_KEY=oid=>"farolVistoria.v2.obra."+oid;
const DEMO_OID="__exemplo";
const C0=5, MAXP=40;

/* ---------- estado ---------- */
let S={oid:null,cfg:null,entries:{},dirty:[],user:"",lastExport:null,demo:true,baseName:"",torre:null,cat:"Apartamento",view:"farol",sel:1};
let IDX={current:null,user:"",sel:1,obras:[]};   // lista de obras guardadas no aparelho
let BASE=null;            // ArrayBuffer da planilha base
let UNDO=[];
let pendingCol=null;
let storageOk=true;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keyOf=(tid,pav,aid)=>tid+"|"+pav+"|"+aid;
const colL=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const colN=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n};
const splitRef=r=>{const m=/^([A-Z]+)(\d+)$/.exec(r);return m?[m[1],+m[2]]:[null,0]};
function pctTxt(x){if(x==null||isNaN(x))return"";if(x>0&&x<0.01)return"<1%";return Math.round(x*100)+"%"}
function cls(x){if(x==null)return"sx";if(x>=1)return"s2";if(x>0)return"s1";return"s0"}

/* ---------- armazenamento no aparelho ---------- */
const slug=n=>String(n||"obra").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"obra";
function obraSummary(){
  const torres=S.cfg.torres.length;let n=0,d=0;
  for(const t of S.cfg.torres){const x=agg(t);n+=x.n;d+=x.d}
  return {oid:S.oid,nome:S.cfg.obra,demo:!!S.demo,torres,pct:d?n/d:null,pend:S.dirty.length,lastExport:S.lastExport,updatedAt:Date.now()};
}
function saveIndex(){try{localStorage.setItem(IDX_KEY,JSON.stringify(IDX));return true}catch(e){return false}}
function loadIndex(){try{const o=JSON.parse(localStorage.getItem(IDX_KEY)||"null");if(o&&Array.isArray(o.obras))IDX=Object.assign(IDX,o)}catch(e){}}
function persist(){
  if(!S.oid||!S.cfg)return;
  try{
    const {oid,cfg,entries,dirty,lastExport,demo,baseName,torre,cat,view}=S;
    localStorage.setItem(OBRA_KEY(oid),JSON.stringify({oid,cfg,entries,dirty,lastExport,demo,baseName,torre,cat,view}));
    const sum=obraSummary();const i=IDX.obras.findIndex(o=>o.oid===oid);
    if(i>=0)IDX.obras[i]=sum;else IDX.obras.push(sum);
    IDX.current=oid;IDX.user=S.user;IDX.sel=S.sel;
    storageOk=saveIndex();
  }catch(e){storageOk=false}
}
function readObra(oid){try{const o=JSON.parse(localStorage.getItem(OBRA_KEY(oid))||"null");return o&&o.cfg?o:null}catch(e){return null}}
async function switchObra(oid){
  if(S.oid&&S.oid!==oid)persist();
  const o=readObra(oid);
  if(!o){IDX.obras=IDX.obras.filter(x=>x.oid!==oid);saveIndex();if(oid===DEMO_OID){await loadDemo();return true}return false}
  Object.assign(S,{oid:o.oid,cfg:o.cfg,entries:o.entries||{},dirty:o.dirty||[],lastExport:o.lastExport||null,demo:!!o.demo,baseName:o.baseName||"",
    torre:o.torre||o.cfg.torres[0].id,cat:o.cat||"Apartamento",view:o.view||"farol"});
  BASE=S.demo?b64ToBuf(DEMO_B64):(await idbGet("base:"+oid));
  UNDO=[];pendingCol=null;render();return true;
}
async function removeObra(oid){
  try{localStorage.removeItem(OBRA_KEY(oid))}catch(e){}
  await idbDel("base:"+oid);
  IDX.obras=IDX.obras.filter(x=>x.oid!==oid);saveIndex();
  if(S.oid===oid){
    S.oid=null;const next=IDX.obras[0];
    if(next)await switchObra(next.oid);else await loadDemo();
  }
}
async function migrateV1(){
  let o=null;try{o=JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){}
  if(!o||!o.cfg)return;
  if(!o.demo){
    const oid=slug(o.cfg.obra);
    try{localStorage.setItem(OBRA_KEY(oid),JSON.stringify({oid,cfg:o.cfg,entries:o.entries||{},dirty:o.dirty||[],lastExport:o.lastExport||null,demo:false,baseName:o.baseName||"",torre:o.torre,cat:o.cat,view:o.view}))}catch(e){return}
    const b=await idbGet("base");if(b){await idbSet("base:"+oid,b);await idbDel("base")}
    IDX.obras.push({oid,nome:o.cfg.obra,demo:false,torres:o.cfg.torres.length,pct:null,pend:(o.dirty||[]).length,lastExport:o.lastExport||null,updatedAt:Date.now()});
    IDX.current=oid;
  }
  IDX.user=o.user||"";IDX.sel=o.sel??1;saveIndex();
  try{localStorage.removeItem(LS_KEY)}catch(e){}
}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("farolVistoria",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const tx=db.transaction("kv","readonly");const q=tx.objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function idbDel(k){try{const db=await idb();await new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}

/* ---------- leitura da planilha ---------- */
const parseXml=s=>new DOMParser().parseFromString(s,"application/xml");
function byTag(node,tag){return node.getElementsByTagNameNS(NS,tag)}
async function openBook(buf){
  const zip=await JSZip.loadAsync(buf);
  const f=p=>zip.file(p);
  if(!f("xl/workbook.xml"))throw new Error("O arquivo não é uma planilha Excel (.xlsx) válida.");
  const wb=parseXml(await f("xl/workbook.xml").async("string"));
  const rels=parseXml(await f("xl/_rels/workbook.xml.rels").async("string"));
  const relMap={};
  for(const r of rels.getElementsByTagName("Relationship")){
    let t=r.getAttribute("Target");t=t.startsWith("/")?t.slice(1):"xl/"+t;relMap[r.getAttribute("Id")]=t;
  }
  const sheets={};
  for(const s of byTag(wb,"sheet")){
    const rid=s.getAttributeNS(RNS,"id")||s.getAttribute("r:id");sheets[s.getAttribute("name")]=relMap[rid];
  }
  let ss=[];
  if(f("xl/sharedStrings.xml")){
    const d=parseXml(await f("xl/sharedStrings.xml").async("string"));
    ss=[...byTag(d,"si")].map(si=>[...byTag(si,"t")].filter(t=>t.parentNode.localName!=="rPh").map(t=>t.textContent).join(""));
  }
  return {zip,wb,sheets,ss};
}
function cellValue(c,ss){
  const t=c.getAttribute("t");const v=byTag(c,"v")[0];
  if(t==="s")return v?ss[+v.textContent]:null;
  if(t==="inlineStr"){return [...byTag(c,"t")].map(x=>x.textContent).join("")}
  if(t==="str")return v?v.textContent:null;
  if(t==="b")return v?v.textContent==="1":null;
  if(t==="e")return null;
  if(!v||v.textContent==="")return null;
  const n=Number(v.textContent);return isNaN(n)?v.textContent:n;
}
async function readSheet(book,name){
  const p=book.sheets[name];if(!p||!book.zip.file(p))return null;
  const doc=parseXml(await book.zip.file(p).async("string"));
  const cells=new Map();
  for(const c of byTag(doc,"c")){const val=cellValue(c,book.ss);if(val!==null&&val!=="")cells.set(c.getAttribute("r"),val)}
  return {path:p,doc,cells};
}
const num=(v,d=0)=>typeof v==="number"&&isFinite(v)?v:(v===""||v==null||isNaN(Number(v))?d:Number(v));
const str=v=>v==null?"":String(v).trim();

async function parseWorkbook(buf){
  const book=await openBook(buf);
  const P=await readSheet(book,"PARAMETROS");
  const A=await readSheet(book,"ATIVIDADES");
  if(!P||!A)throw new Error("Esta planilha não é o modelo Farol de Vistoria: faltam as abas PARAMETROS ou ATIVIDADES.");
  const E=await readSheet(book,"EXCECOES");
  const pc=r=>P.cells.get(r);
  const cfg={obra:str(pc("B2"))||"Obra sem nome",torres:[],exc:{},ativ:[],opts:[]};
  for(let i=5;i<=9;i++){const v=pc("L"+i);if(typeof v==="number")cfg.opts.push(v)}
  if(cfg.opts.length<2)cfg.opts=[0,.25,.5,.8,1];
  cfg.opts=[...new Set(cfg.opts.map(v=>Math.max(0,Math.min(1,v))))].sort((a,b)=>a-b);
  let r=2;
  while(true){
    const id=str(A.cells.get("A"+r));if(!id)break;
    cfg.ativ.push({id,cat:str(A.cells.get("B"+r)),tipo:str(A.cells.get("C"+r)),disc:str(A.cells.get("D"+r)),nome:str(A.cells.get("E"+r)),peso:num(A.cells.get("G"+r),1)});
    r++;
  }
  if(E){for(let i=5;i<=64;i++){
    const t=str(E.cells.get("A"+i)),p=E.cells.get("B"+i);if(!t||typeof p!=="number")continue;
    const g=c=>{const v=E.cells.get(c+i);return typeof v==="number"?v:null};
    cfg.exc[t+"|"+p]={a:g("C"),c:g("D"),s:g("E")};
  }}
  const entries={};const warn=[];
  for(let k=1;k<=10;k++){
    const id=str(pc("A"+(4+k)));if(!id)continue;
    const t={k,id,nome:str(pc("B"+(4+k)))||id,npav:Math.min(MAXP,Math.max(0,Math.round(num(pc("C"+(4+k)))))),p0:Math.round(num(pc("D"+(4+k)))),
      aptos:num(pc("E"+(4+k))),caixas:num(pc("F"+(4+k))),sac:num(pc("G"+(4+k))),sheet:"TORRE "+k,rows:{}};
    const T=await readSheet(book,t.sheet);
    if(!T){warn.push(`A aba "${t.sheet}" não existe na planilha.`);continue}
    const ids=new Set(cfg.ativ.map(a=>a.id));
    for(const [ref,val] of T.cells){
      const [c,row]=splitRef(ref);
      if(c==="A"&&typeof val==="string"&&ids.has(val.trim()))t.rows[val.trim()]=row;
    }
    for(const [aid,row] of Object.entries(t.rows)){
      for(let i=0;i<t.npav;i++){
        const v=T.cells.get(colL(C0+i)+row);
        if(typeof v==="number")entries[keyOf(id,t.p0+i,aid)]={v:Math.max(0,Math.min(1,v)),t:0,u:""};
      }
    }
    cfg.torres.push(t);
  }
  if(!cfg.torres.length)throw new Error("Nenhuma torre cadastrada em PARAMETROS (linhas 5 a 14).");
  return {cfg,entries,warn};
}

/* ---------- cálculos ---------- */
function units(t,pav,tipo){
  let a=t.aptos,c=t.caixas,s=t.sac;const e=S.cfg.exc[t.id+"|"+pav];
  if(e){if(e.a!=null)a=e.a;if(e.c!=null)c=e.c;if(e.s!=null)s=e.s}
  if(tipo==="Pavimento")return 1;if(tipo==="Apartamento")return a;if(tipo==="Hall/Escada")return c;if(tipo==="Sacada")return a*s;return 0;
}
const pavsOf=t=>Array.from({length:t.npav},(_,i)=>t.p0+i);
const actsOf=(t,cat)=>S.cfg.ativ.filter(a=>(!cat||a.cat===cat)&&t.rows[a.id]);
function valOf(t,pav,aid){const e=S.entries[keyOf(t.id,pav,aid)];return e&&e.v!=null?e.v:null}
function agg(t,{cat,pav,aid}={}){
  let n=0,d=0;
  for(const a of actsOf(t,cat)){
    if(aid&&a.id!==aid)continue;
    for(const p of (pav!=null?[pav]:pavsOf(t))){
      if(units(t,p,a.tipo)<=0)continue;
      d+=a.peso;n+=a.peso*(valOf(t,p,a.id)||0);
    }
  }
  return {n,d,p:d?n/d:null};
}
function aggAll(cat){let n=0,d=0;for(const t of S.cfg.torres){const x=agg(t,{cat});n+=x.n;d+=x.d}return d?n/d:null}
const curTorre=()=>S.cfg.torres.find(t=>t.id===S.torre)||S.cfg.torres[0];

/* ---------- render ---------- */
function render(){
  const t=curTorre();if(!t)return;S.torre=t.id;
  $("#obra").textContent=S.cfg.obra;
  $("#demoBanner").hidden=!S.demo;
  $("#dirtyDot").hidden=!S.dirty.length;
  const tp=agg(t).p;
  $("#bigPct").innerHTML=(S.view==="resumo"?pctTxt(aggAll()):pctTxt(tp))+`<span>${S.view==="resumo"?"OBRA":esc(t.id)}</span>`;
  $("#torres").innerHTML=S.cfg.torres.map(x=>`<button class="chip" data-t="${esc(x.id)}" aria-pressed="${S.view!=="resumo"&&x.id===t.id}"><b>${esc(x.nome)}</b> <span class="pct">${pctTxt(agg(x).p)}</span></button>`).join("");
  $("#tabs").innerHTML=CATS.map(c=>`<button class="tab" role="tab" data-cat="${esc(c.key)}" aria-selected="${S.view==="farol"&&S.cat===c.key}"><span class="t">${esc(c.short)}</span><span class="p">${pctTxt(agg(t,{cat:c.key}).p)}</span></button>`).join("")
;
  $("#torres").insertAdjacentHTML("afterbegin",`<button class="chip" id="resumoChip" aria-pressed="${S.view==="resumo"}"><b>Resumo</b></button>`);
  $("#tabs").hidden=S.view==="resumo";
  if(S.view==="resumo")renderResumo();else renderFarol(t);
  renderDock();
  persist();
}
function renderFarol(t){
  const cat=CATS.find(c=>c.key===S.cat)||CATS[1];
  const acts=actsOf(t,cat.key);const pavs=pavsOf(t);
  const st=$("#stage");
  let box=$("#gridbox");
  const keep=box?{x:box.scrollLeft,y:box.scrollTop,id:box.dataset.id}:null;
  if(!acts.length){st.innerHTML=`<div class="wrap empty">Nenhuma atividade de ${esc(cat.key)} nesta torre.</div>`;return}
  let h=`<table class="farol"><thead><tr class="h1"><th class="name" scope="col">${esc(cat.key.toUpperCase())}</th>`;
  for(const p of pavs)h+=`<th class="pv" scope="col" data-pav="${p}" title="Aplicar a todo o ${p}º pavimento">${p}º</th>`;
  h+=`</tr><tr class="h2"><th class="name">Avanço do pavimento</th>`;
  for(const p of pavs){const x=agg(t,{cat:cat.key,pav:p}).p;h+=`<th class="thp ${x==null?"sn":cls(x)}">${x==null?"–":pctTxt(x)}</th>`}
  h+=`</tr></thead><tbody>`;
  for(const a of acts){
    const ap=agg(t,{aid:a.id}).p;
    h+=`<tr><th class="name" scope="row"><span class="ap ${cls(ap)}">${pctTxt(ap)}</span><span class="d">${esc(a.disc)}</span><span class="nm">${esc(a.nome)}</span></th>`;
    for(const p of pavs){
      if(units(t,p,a.tipo)<=0){h+=`<td class="c sn" aria-label="Não se aplica"></td>`;continue}
      const v=valOf(t,p,a.id);
      h+=`<td class="c ${v==null?"s0":cls(v)}" data-pav="${p}" data-a="${esc(a.id)}">${v==null?"":Math.round(v*100)}</td>`;
    }
    h+=`</tr>`;
  }
  h+=`</tbody></table>`;
  const id=t.id+"|"+cat.key;
  st.innerHTML=`<div class="gridbox" id="gridbox" data-id="${esc(id)}">${h}</div>`;
  box=$("#gridbox");
  if(keep&&keep.id===id){box.scrollLeft=keep.x;box.scrollTop=keep.y}
}
function renderResumo(){
  const torres=S.cfg.torres;
  let h=`<div class="resumo wrap"><div class="sum-head"><div><h2>Avanço por torre</h2><p>Toque numa torre para abrir o farol.</p></div></div><div class="rgrid">`;
  for(const t of torres){
    h+=`<button class="card" data-open="${esc(t.id)}"><header><h3>${esc(t.nome)}</h3><span class="g">${pctTxt(agg(t).p)}</span></header>
    <div class="meta">${t.npav} pavimentos · ${t.aptos} aptos/pav · ${t.caixas} caixa(s) de escada</div>`;
    for(const c of CATS){const x=agg(t,{cat:c.key}).p;const col=x==null?"var(--na)":x>=1?"var(--grn)":x>0?"var(--yel)":"var(--red)";
      h+=`<div class="bar"><span>${esc(c.key)}</span><span class="tr"><span class="fi" style="display:block;width:${Math.max(x?2:0,Math.round((x||0)*100))}%;background:${col}"></span></span><span class="v">${pctTxt(x)}</span></div>`}
    h+=`</button>`;
  }
  h+=`</div><div class="sum-head" style="margin-top:22px"><div><h2>Obra inteira</h2><p>Média ponderada de todas as torres, igual ao PAINEL da planilha.</p></div></div><div class="card" style="max-width:520px">`;
  for(const c of CATS){const x=aggAll(c.key);const col=x==null?"var(--na)":x>=1?"var(--grn)":x>0?"var(--yel)":"var(--red)";
    h+=`<div class="bar"><span>${esc(c.key)}</span><span class="tr"><span class="fi" style="display:block;width:${Math.round((x||0)*100)}%;background:${col}"></span></span><span class="v">${pctTxt(x)}</span></div>`}
  h+=`</div></div>`;
  $("#stage").innerHTML=h;
}
function renderDock(){
  const dock=$("#dock");
  dock.hidden=S.view==="resumo";
  const opts=S.cfg.opts;
  if(!opts.includes(S.sel)&&S.sel!=="clear")S.sel=opts[opts.length-1];
  const lab=v=>v>=1?"PRONTO":v>0?"":"NÃO INIC.";
  $("#pal").style.gridTemplateColumns=`repeat(${opts.length},minmax(0,1fr)) repeat(2,minmax(0,1.05fr))`;
  $("#pal").innerHTML=opts.map(v=>`<button class="pb ${cls(v)}" data-v="${v}" aria-pressed="${S.sel===v}">${Math.round(v*100)}%</button>`).join("")+
    `<button class="pb tool" data-v="clear" aria-pressed="${S.sel==="clear"}">Limpar</button><button class="pb tool" id="undoBtn" ${UNDO.length?"":"disabled"}>Desfazer</button>`;
  const selTxt=S.sel==="clear"?"<b>limpar</b>":`<b>${Math.round(S.sel*100)}%</b>`;
  $("#hint").innerHTML=pendingCol
    ?`<span>Aplicar ${selTxt} em todas as atividades de ${esc(S.cat)} no <b>${pendingCol}º pav</b>?</span><button class="btn solid" style="height:30px;padding:0 12px;margin-left:auto" id="colYes">Aplicar</button><button class="btn" style="height:30px;padding:0 12px" id="colNo">Cancelar</button>`
    :`<span>Toque nas células para marcar ${selTxt}. Toque no número do pavimento para marcar a coluna inteira.</span>`;
}

/* ---------- lançamento ---------- */
function setVal(t,pav,aid,v,batch){
  const k=keyOf(t.id,pav,aid);const prev=S.entries[k]?{...S.entries[k]}:null;
  batch.push({k,prev});
  if(v==="clear"){delete S.entries[k]}else{S.entries[k]={v,t:Date.now(),u:S.user||""}}
  if(!S.dirty.includes(k))S.dirty.push(k);
}
function commit(batch){if(!batch.length)return;UNDO.push(batch);if(UNDO.length>200)UNDO.shift();render()}
function undo(){
  const b=UNDO.pop();if(!b)return;
  for(const {k,prev} of b.reverse()){if(prev)S.entries[k]=prev;else delete S.entries[k]}
  render();toast("Lançamento desfeito");
}
function tapCell(td){
  const t=curTorre();const pav=+td.dataset.pav,aid=td.dataset.a;
  const b=[];setVal(t,pav,aid,S.sel,b);commit(b);
  const el=document.querySelector(`#gridbox td[data-pav="${pav}"][data-a="${CSS.escape(aid)}"]`);
  if(el){el.classList.add("flash");}
}
function applyCol(pav){
  const t=curTorre();const b=[];
  for(const a of actsOf(t,S.cat))if(units(t,pav,a.tipo)>0)setVal(t,pav,a.id,S.sel,b);
  pendingCol=null;commit(b);toast(`${pav}º pavimento atualizado`);
}

/* ---------- arquivos ---------- */
async function offerFile(filename,data){
  if(window.claude&&typeof window.claude.use==="function"){
    let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(dl){
      try{await dl.save({filename,data});return true}
      catch(e){if(e&&e.code==="declined")return false;toast(e&&e.code==="rate_limited"?"Aguarde a janela anterior e tente de novo.":"Não foi possível salvar o arquivo aqui.");return false}
    }
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);return true;
  }catch(e){toast("Não foi possível salvar o arquivo.");return false}
}
function setCell(doc,sheetData,rowsMap,ref,val){
  const [cl,r]=splitRef(ref);
  let row=rowsMap.get(r);
  if(!row){
    row=doc.createElementNS(NS,"row");row.setAttribute("r",String(r));
    let after=null;for(const x of byTag(sheetData,"row")){if(+x.getAttribute("r")>r){after=x;break}}
    sheetData.insertBefore(row,after);rowsMap.set(r,row);
  }
  let c=null,next=null;
  for(const x of row.children){if(x.localName!=="c")continue;const [xc]=splitRef(x.getAttribute("r"));if(xc===cl){c=x;break}if(colN(xc)>colN(cl)&&!next)next=x}
  if(!c){if(val==null)return;c=doc.createElementNS(NS,"c");c.setAttribute("r",ref);row.insertBefore(c,next);row.removeAttribute("spans")}
  c.removeAttribute("t");
  while(c.firstChild)c.removeChild(c.firstChild);
  if(val!=null){const v=doc.createElementNS(NS,"v");v.textContent=String(val);c.appendChild(v)}
}
const ser=doc=>{let s=new XMLSerializer().serializeToString(doc);if(!s.startsWith("<?xml"))s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s;return s};
function excelDate(ms){const d=new Date(ms);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+25569}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const safeName=s=>s.replace(/[\\/:*?"<>|]+/g," ").trim()||"Obra";

async function buildXlsx(){
  const buf=BASE||(S.demo?b64ToBuf(DEMO_B64):await idbGet("base:"+S.oid));
  if(!buf)throw new Error("A planilha base não está no aparelho. Carregue a planilha da obra de novo e depois exporte.");
  const book=await openBook(buf);
  for(const t of S.cfg.torres){
    const p=book.sheets[t.sheet];if(!p)continue;
    const doc=parseXml(await book.zip.file(p).async("string"));
    const sd=byTag(doc,"sheetData")[0];const rowsMap=new Map();
    for(const r of byTag(sd,"row"))rowsMap.set(+r.getAttribute("r"),r);
    let last=0;
    for(const [aid,row] of Object.entries(t.rows)){
      for(let i=0;i<t.npav;i++){
        const e=S.entries[keyOf(t.id,t.p0+i,aid)];
        setCell(doc,sd,rowsMap,colL(C0+i)+row,e&&e.v!=null?e.v:null);
        if(e&&e.t>last)last=e.t;
      }
    }
    if(last)setCell(doc,sd,rowsMap,"C3",excelDate(last));
    book.zip.file(p,ser(doc));
  }
  const cp=byTag(book.wb,"calcPr")[0];
  if(cp){cp.setAttribute("fullCalcOnLoad","1")}
  else{const c=book.wb.createElementNS(NS,"calcPr");c.setAttribute("calcId","191029");c.setAttribute("fullCalcOnLoad","1");
    const anchor=byTag(book.wb,"definedNames")[0]||byTag(book.wb,"sheets")[0];anchor.parentNode.insertBefore(c,anchor.nextSibling)}
  book.zip.file("xl/workbook.xml",ser(book.wb));
  if(book.zip.file("xl/calcChain.xml")){/* fórmulas não mudam; mantido */}
  return await book.zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function exportXlsx(){
  closeLayer();toast("Gerando planilha…");
  try{
    const blob=await buildXlsx();
    const ok=await offerFile(`${safeName(S.cfg.obra)} - Farol ${today()}.xlsx`,blob);
    if(ok){S.dirty=[];S.lastExport=Date.now();render();toast("Planilha exportada. Abra no Excel para ver o painel atualizado.")}
  }catch(e){toast(e.message||"Falha ao gerar a planilha.")}
}
async function exportJson(){
  closeLayer();
  const data=JSON.stringify({formato:"farol-vistoria",versao:1,obra:S.cfg.obra,geradoEm:new Date().toISOString(),responsavel:S.user,lancamentos:S.entries},null,0);
  const ok=await offerFile(`${safeName(S.cfg.obra)} - Backup ${today()}.json`,data);
  if(ok)toast("Backup salvo.");
}
async function importJson(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.formato!=="farol-vistoria"||typeof o.lancamentos!=="object")throw new Error("Arquivo de backup inválido.");
    const target=slug(o.obra);
    if(target!==S.oid){
      if(IDX.obras.some(x=>x.oid===target)){await switchObra(target);mergeEntries(o.lancamentos);return}
      showConfirm(`O backup é da obra "${esc(o.obra)}", que não está neste aparelho. Juntar com a obra aberta, "${esc(S.cfg.obra)}"?`,"Juntar",()=>mergeEntries(o.lancamentos));return}
    mergeEntries(o.lancamentos);
  }catch(e){toast(e.message||"Não foi possível ler o backup.")}
}
function mergeEntries(inc){
  let n=0;
  for(const [k,e] of Object.entries(inc)){
    if(!e||typeof e.v!=="number")continue;const cur=S.entries[k];
    if(!cur||(e.t||0)>(cur.t||0)){S.entries[k]={v:e.v,t:e.t||0,u:e.u||""};if(!S.dirty.includes(k))S.dirty.push(k);n++}
  }
  UNDO=[];closeLayer();render();toast(n?`${n} lançamento(s) importado(s). Os mais recentes prevaleceram.`:"Nada novo no backup.");
}
async function loadXlsx(file){
  closeLayer();toast("Lendo planilha…");
  try{
    const buf=await file.arrayBuffer();
    const parsed=await parseWorkbook(buf);
    const oid=slug(parsed.cfg.obra);
    const exists=IDX.obras.some(x=>x.oid===oid);
    if(exists&&S.oid!==oid)await switchObra(oid);
    const isNew=!exists;
    const finish=async keep=>{
      if(S.oid&&S.oid!==oid)persist();
      const entries=parsed.entries;let dirty=[];
      if(keep){for(const k of S.dirty){if(S.entries[k]){entries[k]=S.entries[k];dirty.push(k)}}}
      const prevTorre=S.oid===oid?S.torre:null;
      Object.assign(S,{oid,cfg:parsed.cfg,entries,dirty,demo:false,baseName:file.name,view:"farol",
        lastExport:S.oid===oid?S.lastExport:null,cat:S.oid===oid?S.cat:"Apartamento"});
      S.torre=parsed.cfg.torres.some(t=>t.id===prevTorre)?prevTorre:parsed.cfg.torres[0].id;
      BASE=buf.slice(0);
      const ok=await idbSet("base:"+oid,buf.slice(0));
      UNDO=[];pendingCol=null;render();
      // o exemplo sai da lista quando a primeira obra real entra
      const demo=IDX.obras.find(x=>x.oid===DEMO_OID);
      if(demo&&!demo.pend){try{localStorage.removeItem(OBRA_KEY(DEMO_OID))}catch(e){}IDX.obras=IDX.obras.filter(x=>x.oid!==DEMO_OID);saveIndex()}
      let msg=isNew?`Obra adicionada: ${S.cfg.obra} (${S.cfg.torres.length} torre(s))`:`${S.cfg.obra} atualizada pela planilha`;
      if(parsed.warn.length)msg+=". "+parsed.warn.join(" ");
      if(!ok)msg+=". Atenção: o aparelho não guardou a planilha; exporte antes de fechar o app.";
      toast(msg);
    };
    if(!isNew&&S.oid===oid&&S.dirty.length){
      showChoice(`${esc(S.cfg.obra)} tem ${S.dirty.length} lançamento(s) neste aparelho que ainda não foram exportados.`,
        [["Manter por cima da planilha",()=>finish(true),"solid"],["Descartar",()=>finish(false),"danger"]]);
    }else await finish(false);
  }catch(e){toast(e.message||"Não foi possível ler a planilha.")}
}

        [["Remover",async()=>{await removeObra(o.oid);toast("Obra removida do aparelho");openObras()},"danger"]])}
  });
}

let toastTimer=null;
function toast(msg){
  let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3200);
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const td=e.target.closest("#gridbox td.c");
  if(td&&!td.classList.contains("sn")&&td.dataset.a){tapCell(td);return}
  const pv=e.target.closest("#gridbox th.pv");
  if(pv){pendingCol=+pv.dataset.pav;renderDock();return}
  const chip=e.target.closest(".chip");
  if(chip){if(chip.id==="resumoChip"){S.view="resumo"}else{S.torre=chip.dataset.t;S.view="farol"}pendingCol=null;render();return}
  const tab=e.target.closest(".tab");
  if(tab){S.cat=tab.dataset.cat;S.view="farol";pendingCol=null;render();return}
  const card=e.target.closest("[data-open]");
  if(card){S.torre=card.dataset.open;S.view="farol";render();return}
  const pb=e.target.closest(".pb");
  if(pb){if(pb.id==="undoBtn"){undo();return}S.sel=pb.dataset.v==="clear"?"clear":+pb.dataset.v;renderDock();persist();return}
  if(e.target.id==="colYes"){applyCol(pendingCol);return}
  if(e.target.id==="colNo"){pendingCol=null;renderDock();return}
});
$("#menuBtn").onclick=openMenu;
$("#obraBtn").onclick=openObras;
$("#demoLoad").onclick=()=>$("#fileXlsx").click();
$("#fileXlsx").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)loadXlsx(f)});
$("#fileJson").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importJson(f)});

/* ---------- início ---------- */
function b64ToBuf(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function loadDemo(){
  const buf=b64ToBuf(DEMO_B64);const p=await parseWorkbook(buf);
  Object.assign(S,{oid:DEMO_OID,cfg:p.cfg,entries:p.entries,dirty:[],demo:true,baseName:"Exemplo Uniq",lastExport:null,torre:p.cfg.torres[0].id,view:"farol",cat:"Apartamento"});
  BASE=buf;UNDO=[];pendingCol=null;render();
}
(async function start(){
  if(typeof JSZip==="undefined"){$("#stage").innerHTML=`<div class="wrap empty">Não foi possível carregar o leitor de planilhas. Verifique a conexão e abra de novo.</div>`;return}
  loadIndex();
  if(!IDX.obras.length)await migrateV1();
  S.user=IDX.user||"";S.sel=IDX.sel??1;
  let opened=false;
  for(const oid of [IDX.current,...IDX.obras.map(o=>o.oid)]){if(oid&&await switchObra(oid)){opened=true;break}}
  if(!opened){try{await loadDemo()}catch(e){$("#stage").innerHTML=`<div class="wrap empty">${esc(e.message)}</div>`}}
})();
